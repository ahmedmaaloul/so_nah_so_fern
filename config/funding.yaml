# =============================================================================
# So nah, so fern: Öffentliche Mittel für den ÖPNV / Argent public pour les TC
# -----------------------------------------------------------------------------
# DE: Von Hand erfasste Beträge aus öffentlichen Quellen (keine Pipeline-Daten).
#     15_export_funding.py prüft sie, rechnet Euro je Einwohner und schreibt
#     web/data/funding.json. Beträge in Mio. EUR, laufende Preise, außer `price_base`.
# FR : Montants relevés à la main dans des sources publiques (pas de calcul du
#     pipeline). 15_export_funding.py les contrôle, calcule les euros par habitant et
#     écrit web/data/funding.json. Montants en M EUR courants, sauf `price_base`.
#
# Périmètres différents / Unterschiedliche Abgrenzung :
#   IDFM organise et finance tout le réseau francilien (exploitation et matériel
#   roulant) ; le Grand Paris Express est payé à part (Société des grands projets).
#   In Hessen gibt es keine Gesamtsumme : Betrieb über RMV und lokale Nahverkehrs-
#   organisationen, Infrastruktur über Bund, Land, DB und Kommunen, Projekt für Projekt.
#   Seule comparaison retenue comme comparable : coût total des grands projets
#   ferroviaires régionaux en cours, rapporté à la population de l'autorité.
# Consulté le / abgerufen am 07/10/2026.
# =============================================================================

